# Checks every pull request (including Dependabot's) before it can be merged:
#  - flags newly added dependencies with known vulnerabilities
#  - makes sure the app still installs, parses and packages on Windows
# Nothing is published from here; releases only come from pushes to main.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
    permissions:
      contents: read
      pull-requests: write

  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          for f in $(git ls-files 'src/**/*.js'); do node --check "$f" || exit 1; done
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Package (no installer, no publish)
        run: npx electron-builder --win --dir --publish never
