# Builds the Windows installer and publishes a GitHub Release on every push to main.
#
# Version numbering:
#   VERSION (repo root) is the base version, e.g. 0.1.3.
#   - If v<VERSION> isn't released yet, that exact version is built.
#   - Otherwise the patch number counts up from the newest release in that
#     major.minor line (0.1.3 released -> 0.1.4, then 0.1.5, ...).
#   To start a new line (0.2.0, 1.0.0), edit VERSION.
#
# Skip a release for a commit by putting [skip release] in its message.
# Commits that only touch docs or the PHP upload script don't trigger a build.
#
# Release assets: SnipNShare-Setup-X.Y.Z.exe, .exe.blockmap, latest.yml
# (latest.yml is what the in-app updater reads).
#
# Code signing (Azure Trusted Signing) switches on automatically when these repo
# secrets exist - see README "Code signing". Without them the build is unsigned.
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   (service principal)
#   AZURE_SIGN_ENDPOINT    e.g. https://eus.codesigning.azure.net
#   AZURE_SIGN_ACCOUNT     Trusted Signing account name
#   AZURE_SIGN_PROFILE     certificate profile name
#   AZURE_SIGN_PUBLISHER   certificate subject, e.g. CN=Andrew Lyle, O=Andrew Lyle, L=Cambridge, S=Ontario, C=CA
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'server/**'
      - '.gitignore'
      - '*.bat'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Work out version
        id: ver
        run: |
          BASE=$(tr -d ' \r\n' < VERSION)
          TAGS=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          V=$(BASE="$BASE" TAGS="$TAGS" node -e '
            const parse = (s) => { const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(s); return m && m.slice(1).map(Number); };
            const base = parse(process.env.BASE);
            if (!base) { console.error("VERSION must look like 1.2.3, got: " + process.env.BASE); process.exit(1); }
            const tags = process.env.TAGS.split(/\s+/).map(parse).filter(Boolean);
            const key = (v) => v.join(".");
            const taken = new Set(tags.map(key));
            if (!taken.has(key(base))) { console.log(key(base)); process.exit(0); }
            const line = tags.filter((t) => t[0] === base[0] && t[1] === base[1]);
            const top = Math.max(base[2], ...line.map((t) => t[2]));
            console.log(`${base[0]}.${base[1]}.${top + 1}`);
          ')
          echo "Releasing v$V (VERSION base: $BASE)"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Stamp version into package.json
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Configure code signing (only if the Azure secrets are set)
        id: sign
        env:
          ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          HAS_SP: ${{ secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' }}
        run: |
          if [ "$HAS_SP" = "true" ] && [ -n "$ENDPOINT" ] && [ -n "$ACCOUNT" ] && [ -n "$PROFILE" ] && [ -n "$PUBLISHER" ]; then
            npm pkg set \
              build.win.azureSignOptions.endpoint="$ENDPOINT" \
              build.win.azureSignOptions.codeSigningAccountName="$ACCOUNT" \
              build.win.azureSignOptions.certificateProfileName="$PROFILE" \
              build.win.azureSignOptions.publisherName="$PUBLISHER"
            npm pkg set build.forceCodeSigning=true --json
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code signing: ON ($ACCOUNT / $PROFILE)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Code signing: OFF (Azure secrets not set - build will be unsigned)"
          fi

      - name: Build installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npx electron-builder --win --publish never

      - name: Verify artifacts
        run: |
          ls -la dist
          test -f dist/latest.yml || { echo "latest.yml missing"; exit 1; }
          test -f "dist/SnipNShare-Setup-${{ steps.ver.outputs.version }}.exe" || { echo "installer missing"; exit 1; }

      - name: Verify signature
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/SnipNShare-Setup-${{ steps.ver.outputs.version }}.exe"
          "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer is not validly signed" }
          if (-not $sig.TimeStamperCertificate) { throw "Installer signature is not timestamped" }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/SnipNShare-Setup-*.exe
            dist/SnipNShare-Setup-*.exe.blockmap
            dist/latest.yml
