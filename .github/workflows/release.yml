# Builds the Windows installer and publishes it to a GitHub Release.
# Trigger: push a tag like v0.1.2 (release.bat does the bump + tag + push).
# Output on the release: SnipNShare-Setup-x.y.z.exe, .exe.blockmap, latest.yml
# (latest.yml is what the in-app updater reads).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer (no publish - we upload ourselves)
        run: npx electron-builder --win --publish never

      - name: Verify artifacts
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml || { echo "latest.yml missing"; exit 1; }
          ls dist/SnipNShare-Setup-*.exe >/dev/null || { echo "installer missing"; exit 1; }

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SnipNShare-Setup-*.exe
            dist/SnipNShare-Setup-*.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
          make_latest: true
