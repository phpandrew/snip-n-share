<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snip n Share</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
  #shot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); pointer-events: none; }
  #sel { position: absolute; display: none; border: 1px solid #4da3ff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); background: transparent; pointer-events: none; }
  #sel::before { content: ''; position: absolute; inset: 0; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); }
  #sel-img { position: absolute; display: none; pointer-events: none; }
  #size { position: absolute; display: none; padding: 3px 8px; font: 12px/1.3 Segoe UI, system-ui, sans-serif; color: #fff; background: rgba(20,20,24,.9); border-radius: 4px; pointer-events: none; white-space: nowrap; }
  #hint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; font: 13px Segoe UI, system-ui, sans-serif; color: #eee; background: rgba(20,20,24,.85); border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
  <img id="shot" draggable="false">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint">Drag to select an area · Click = whole screen · Esc = cancel</div>
  <script src="overlay.js"></script>
</body>
</html>
